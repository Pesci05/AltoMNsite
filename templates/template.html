{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="stylesheet" href="{% static "template.css" %}">
</head>
<body >
    
    <!--NAV BAR-->
    <nav>
        <ul>
            <li><img src="{% static "logo.jpeg" %}" class="nav_logo"></li>
            <a href=" {% url 'home' %} "><li class = "linkNavBar">Home</li></a>

        </ul>
    </nav>

    <div class="container">
        {% block content %}
        {% endblock %}        
    </div>

    
    <footer>
        <p>numero di telefono</p>
        <p>Indirizzo</p>
        <p>emai</p>
    </footer>

    <script src="{% static "script.js" %}"></script>
